services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hearthy-db
    environment:
      POSTGRES_USER: hearthy
      POSTGRES_PASSWORD: hearthy
      POSTGRES_DB: hearthy
    ports:
      - '5433:5432'
    volumes:
      - hearthy-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hearthy -d hearthy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hearthy-data:
